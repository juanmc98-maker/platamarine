<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Plata Marine</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E3042">
<link rel="icon" type="image/png" href="/logo-plata-marine.png">
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E3042;color:#F4F1EA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;}
  .wrap{max-width:480px;}
  img{width:120px;margin-bottom:24px;opacity:.95;}
  h1{font-size:clamp(22px,4vw,30px);margin:0 0 12px;}
  p{font-size:16px;line-height:1.5;color:#C9D3D8;margin:0 0 28px;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  a.btn{display:inline-block;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;}
  a.primary{background:#C9A24B;color:#0E3042;}
  a.secondary{border:1px solid #C9A24B;color:#F4F1EA;}
</style>
</head>
<body>
<div class="wrap">
  <img src="/logo-plata-marine.png" alt="Plata Marine">
  <h1 id="t404h1">Esta página se ha quedado varada</h1>
  <p id="t404p">No encuentro lo que buscas: puede que el enlace haya cambiado o que ese barco ya no esté disponible.</p>
  <div class="btns">
    <a class="btn primary" id="t404home" href="/">Volver al inicio</a>
    <a class="btn secondary" id="t404boats" href="/barcos/">Ver barcos en venta</a>
  </div>
</div>
<script>
(function(){
  var p = location.pathname;
  var lang = p.indexOf("/ca/") === 0 ? "ca" : (p.indexOf("/en/") === 0 ? "en" : "es");
  var t = {
    es: {h1:"Esta página se ha quedado varada", p:"No encuentro lo que buscas: puede que el enlace haya cambiado o que ese barco ya no esté disponible.", home:"Volver al inicio", boats:"Ver barcos en venta", homeHref:"/", boatsHref:"/barcos/"},
    ca: {h1:"Aquesta pàgina s'ha quedat varada", p:"No trobo el que busques: potser l'enllaç ha canviat o aquest barco ja no està disponible.", home:"Tornar a l'inici", boats:"Veure barcos en venda", homeHref:"/ca/", boatsHref:"/ca/barcos/"},
    en: {h1:"This page has run aground", p:"I can't find what you're looking for: the link may have changed, or that boat may no longer be available.", home:"Back to home", boats:"See boats for sale", homeHref:"/en/", boatsHref:"/en/barcos/"}
  }[lang];
  document.documentElement.lang = lang;
  document.getElementById("t404h1").textContent = t.h1;
  document.getElementById("t404p").textContent = t.p;
  var home = document.getElementById("t404home"); home.textContent = t.home; home.href = t.homeHref;
  var boats = document.getElementById("t404boats"); boats.textContent = t.boats; boats.href = t.boatsHref;
})();
</script>
</body>
</html>
