<!-- 1) Subir a /video/ del repo: hero-720.mp4, hero-540.mp4, hero-poster.jpg -->

<!-- 2) Dentro de la sección hero de index.html (y /ca/ y /en/), como primer hijo: -->
<div class="hero-video" aria-hidden="true">
  <video autoplay muted loop playsinline preload="metadata" poster="/hero-poster.jpg">
    <source src="/hero-540.mp4" type="video/mp4" media="(max-width: 768px)">
    <source src="/hero-720.mp4" type="video/mp4">
  </video>
</div>

<!-- 3) CSS (añadir al <style> de la home). La sección hero necesita position:relative -->
<style>
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero-video{position:absolute;inset:0;z-index:-1}
.hero-video video{width:100%;height:100%;object-fit:cover;display:block}
.hero-video::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,12,18,.55),rgba(8,12,18,.75))}
@media (prefers-reduced-motion:reduce){.hero-video video{display:none}
  .hero-video{background:url(/hero-poster.jpg) center/cover}}
</style>

<!-- 4) Móvil: el atributo media en <source> no lo respetan todos los navegadores; este JS lo garantiza -->
<script>
(function(){var v=document.querySelector('.hero-video video');if(!v)return;
if(matchMedia('(max-width:768px)').matches){v.src='/hero-540.mp4';}
if(navigator.connection&&navigator.connection.saveData){v.removeAttribute('autoplay');v.pause();}})();
</script>
